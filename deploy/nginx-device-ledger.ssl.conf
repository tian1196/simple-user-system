# ============================================================
# 设备台账 Nginx 配置 —— HTTPS（生产推荐）
#
# 安装位置：/etc/nginx/conf.d/device-ledger.conf
# 生效命令：nginx -t && systemctl reload nginx
#
# 证书可用 Let's Encrypt（certbot --nginx）自动申请并改写本文件，
# 或把 ssl_certificate / ssl_certificate_key 指向你的证书路径。
# 启用 HTTPS 后，记得把 systemd 里 COOKIE_SECURE 设为 true。
# ============================================================

# HTTP 一律跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    # 有域名后改成域名
    server_name _;

    # certbot 验证目录（使用 Let's Encrypt 时保留）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # —— 证书路径（certbot 会自动填，或手动改成你的证书）——
    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # 基础安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---------- 站点 + 后台 ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
