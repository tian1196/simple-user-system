# ============================================================
# 设备台账 Nginx 配置 —— HTTP（仅用于首次测试 / 申请证书）
#
# 安装位置：/etc/nginx/conf.d/device-ledger.conf
# 生效命令：nginx -t && systemctl reload nginx
#
# 说明：
#   - Node 服务监听 127.0.0.1:3000，Nginx 统一对外；
#   - 前端与后端同源，/api 反代到 Node，无跨域问题；
#   - 正式对外请使用 HTTPS 版本（device-ledger.ssl.conf）。
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # 有域名后改成域名，例如 ledger.example.com
    server_name _;

    # 上传体积留余量（当前后端 JSON 限制 16KB，这里可适度放宽）
    client_max_body_size 2m;

    # Certbot webroot 验证，不转发给 SPA。
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 透传真实信息，便于后端同源校验/审计拿到正确来源
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---------- 用户站点 + Vue 管理后台（由 Node 托管静态文件） ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
